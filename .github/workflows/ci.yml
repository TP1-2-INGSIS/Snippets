name: CI

# CI: valida (formatter, linter, tests y cobertura) PRs y pushes.
# La publicación de la imagen vive en cd.yml y solo corre para main.
on:
  pull_request:
    branches: [main, dev]
  push:
    # Cualquier rama (feature/**, refactor/**, fix/**, etc.)
    branches: ['**']

permissions:
  contents: read

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # Ejecuta formatter, linter, compilación, Testcontainers y verificación de cobertura JaCoCo (mínimo 80%)
      - name: Run Checks, Tests & JaCoCo Verification
        run: ./gradlew check

      - name: Upload JaCoCo Coverage Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jacoco-report
          path: build/reports/jacoco/test/html
