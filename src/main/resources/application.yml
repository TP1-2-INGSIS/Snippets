spring:
  application:
    name: snippet-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/snippets}
    username: ${DB_USER:snippets}
    password: ${DB_PASSWORD:snippets}
  data:
    redis:
      url: ${REDIS_URL:redis://localhost:6379}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    locations: classpath:db/migration

# D02: identity. Auth0 access tokens are validated when AUTH0_* are set; X-User-Id is only
# accepted when AUTH_HEADER_IDENTITY_ENABLED=true (tests, local, e2e).
auth:
  issuer-uri: ${AUTH0_ISSUER_URI:}
  audience: ${AUTH0_AUDIENCE:}
  jwks-uri: ${AUTH0_JWKS_URI:}
  header-identity-enabled: ${AUTH_HEADER_IDENTITY_ENABLED:false}

server:
  port: ${PORT:8080}

services:
  connect-timeout: ${SERVICES_CONNECT_TIMEOUT:2s}
  # Must stay above Language Service's 5s execution limit.
  read-timeout: ${SERVICES_READ_TIMEOUT:10s}
  language:
    url: ${LANGUAGE_SERVICE_URL:http://localhost:8082}
  permission:
    url: ${PERMISSION_SERVICE_URL:http://localhost:8081}

# US10: interactive execution relay (WebSocket). Safety net above Language's own limits.
run:
  idle-timeout: ${RUN_IDLE_TIMEOUT:6m}

download:
  fallback: txt
  extensions:
    printscript: ps
    python: py

# D14: lint/format masivos asincronos con Redis Streams. Snippets publica en `stream` y consume
# `results-stream`; `timeout` es cuanto espera el reaper antes de re-encolar un PENDING.
tasks:
  stream: ${REDIS_STREAM_TASKS:tasks:printscript}
  results-stream: ${REDIS_STREAM_RESULTS:tasks:results}
  results-group: ${REDIS_RESULTS_GROUP:snippet-service}
  timeout: ${TASK_TIMEOUT:5m}
  max-requeues: 3
  consumer-enabled: ${TASKS_CONSUMER_ENABLED:true}
  poll-interval: 500ms
  claim-idle: 60s
  claim-interval: 30s
  max-deliveries: 5
  retry-backoff: ${TASK_RETRY_BACKOFF:2s}
  reaper-interval: ${TASK_REAPER_INTERVAL:60s}

# Revalidacion por version del motor: se chequea GET /languages al arrancar y cada intervalo.
engine:
  check-interval: ${ENGINE_CHECK_INTERVAL:10m}
  page-size: 500
