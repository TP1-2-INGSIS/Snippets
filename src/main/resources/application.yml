spring:
  application:
    name: snippet-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/snippets}
    username: ${DB_USER:snippets}
    password: ${DB_PASSWORD:snippets}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    locations: classpath:db/migration

server:
  port: ${PORT:8080}

services:
  connect-timeout: ${SERVICES_CONNECT_TIMEOUT:2s}
  # Must stay above Language Service's 5s execution limit.
  read-timeout: ${SERVICES_READ_TIMEOUT:10s}
  language:
    url: ${LANGUAGE_SERVICE_URL:http://localhost:8082}
  permission:
    url: ${PERMISSION_SERVICE_URL:http://localhost:8081}

download:
  fallback: txt
  extensions:
    printscript: ps
    python: py
